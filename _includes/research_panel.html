<div class="research-panel{% if include.reverse == 1 %} reverse{% endif %}">
  <img class="research-hero" src="{{ include.image | default: '/assets/img/research/placeholder1.svg' }}" alt="{{ include.title }}">
  <div class="research-text">
    <h3>{{ include.title }}</h3>
    {% if include.summary %}
      <p>{{ include.summary }}</p>
    {% else %}
      <p>{{ include.excerpt | strip }}</p>
    {% endif %}
  </div>
  {% if include.images and include.images.size > 0 %}
  <div class="gallery-side">
    {% for g in include.images %}
      <a href="{{ g.url }}" class="gallery-item" data-caption="{{ g.caption | escape }}">
        <img src="{{ g.url }}" alt="{{ g.caption | default: include.title }}">
      </a>
    {% endfor %}
  </div>
  {% endif %}
</div>
