<div class="person">
  <img src="{{ include.image | default: 'https://via.placeholder.com/150' }}" alt="{{ include.name }}">
  <h3><a href="{{ include.url }}">{{ include.name }}</a></h3>
  {% if include.role %}<p>{{ include.role }}</p>{% endif %}
  <p class="social-icons">
    {% if include.website %}
      <a href="{{ include.website }}" target="_blank" aria-label="Website" rel="noopener" class="icon-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10.9 2a8.9 8.9 0 100 17.8A8.9 8.9 0 0010.9 2zm0 1.8a7.1 7.1 0 110 14.2 7.1 7.1 0 010-14.2zm6.8 1.6l4.3 4.3-8.8 8.8H8.9v-4.3l8.8-8.8z" fill="currentColor"/></svg>
      </a>
    {% endif %}
    {% if include.orcid %}
      <a href="https://orcid.org/{{ include.orcid }}" target="_blank" aria-label="ORCID" rel="noopener" class="icon-orcid">
        <svg width="18" height="18" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M128 0C57.3 0 0 57.3 0 128s57.3 128 128 128 128-57.3 128-128S198.7 0 128 0zm-29.4 61.3h16.1v133.3h-16.1V61.3zM96.6 128c0-35.2 28.5-63.7 63.7-63.7 35.2 0 63.7 28.5 63.7 63.7s-28.5 63.7-63.7 63.7c-35.2 0-63.7-28.5-63.7-63.7zm111.2 0c0-26.2-21.3-47.5-47.5-47.5S112.8 101.8 112.8 128s21.3 47.5 47.5 47.5 47.5-21.3 47.5-47.5z"/></svg>
      </a>
    {% endif %}
    {% if include.scholar %}
      <a href="{{ include.scholar }}" target="_blank" aria-label="Google Scholar" rel="noopener" class="icon-scholar">
        <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><path d="M12 2L1 9l11 7 9-5.727V18h2V9L12 2zm0 9.333L4.197 9 12 4.667 19.803 9 12 11.333zM6 19a6 6 0 1112 0H6z"/></svg>
      </a>
    {% endif %}
  </p>
</div>
