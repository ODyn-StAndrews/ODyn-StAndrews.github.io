<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <!-- Modern sans-serif font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    {% if page.url == '/' %}
    <video autoplay loop muted>
      <source src="/wash1.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    {% endif %}
    <div class="logo-container">
      <img src="/assets/img/people/placeholder.svg" alt="Group Logo" class="large-logo">
      <div class="title-container">
        <h1><a href="/">{{ site.title }}</a></h1>
        <img class="university-logo" src="/assets/img/logos/standrews/02-standard-white-text.png" alt="University of St Andrews">
      </div>
    </div>
    <nav>
      <ul>
        <li><a href="/index.html#about">About</a></li>
        <li><a href="/index.html#research">Research</a></li>
        <li><a href="/index.html#people">People</a></li>
        <li><a href="/index.html#publications">Publications</a></li>
        <li><a href="/index.html#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>&copy; {{ "now" | date: "%Y" }} Ocean Dynamics @ St Andrews. All rights reserved.</p>
  </footer>

  <script src="/assets/js/main.js"></script>
</body>
</html>
