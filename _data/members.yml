    bio: "I am an oceanographer and climate scientist. My research is concerned with mixing processes in the ocean and their implications for climate."
    understanding how climate-relevant tracers, such as heat and carbon dioxide, are
    taken up by, stored within, and transported around the ocean. This is achieved
    by a combination of atmosphere-ocean exchange, the large-scale ocean circulation,
    turbulent ocean dynamics, and biogeochemical processes. I'm interested in understanding
    the impact of these processes on the marine environment as well as Earth's climate
    more broadly. I use a host of tools in my research, including large-scale numerical
    simulations, process models, theoretical ideas, trajectory analysis, and ocean
    observations.
