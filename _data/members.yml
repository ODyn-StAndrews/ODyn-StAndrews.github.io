    bio: "PhD researcher focusing on how the Southern Ocean circulates tracers (heat, carbon, etc.) and the roles of mesoscale and submesoscale processes."
    oxygen, nutrients, etc.), including the interaction between different scales of
    ocean motions, and the spatial and temporal variability. The Southern Ocean is
    a crucial connection between different ocean basins and between the abyss to the
    upper ocean and atmosphere. It transports heat, moisture, and carbon around the
    globe, thus having huge implication on the global climate. I will apply ocean
    model analysis and theoretical ideas to better understand the mechanisms that
    drive tracer transport and their potential response to the changing climate. Before
    coming to St Andrews, I graduated with a Bachelor’s degree in Mathematics from
    Nanjing University.
