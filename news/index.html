---
layout: default
title: News
---

<section id="news">
  <h2>All News</h2>
  <ul class="news-list">
    {% assign items = site.news | sort: 'date' | reverse %}
    {% for n in items %}
      <li>
        <span class="news-emoji">{{ n.emoji | default: '📰' }}</span>
        <a href="{{ n.url }}">{{ n.title }}</a>
        <small>{{ n.date | date: "%b %d, %Y" }}</small>
      </li>
    {% endfor %}
  </ul>
</section>
